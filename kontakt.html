<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olles AB - Hem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="title1">
            <a href="index.html">
                <img src="https://ollesab.mockelngymnasiet.com/res/OllLogo.png" alt="Olles_AB">
            </a>
        </div>
        <h1 class="title2">För framtiden redan idag</h1>
        <nav>
            <a href="index.html">Hem</a>
            <a href="om.html">Om</a>
            <a href="miljo.html">Miljöpolicy</a>
            <a href="kontakt.html">Kontaktinformation</a>
        </nav>
    </header>
    <main>
        <div class="bar"></div>
        <div class="top_banner">
            <img src="https://ollesab.mockelngymnasiet.com/res/cnc.jpg" alt="Produkt">
        </div>
        <div class="texti">
            <article>
                <h2>Kontaktformulär</h2>
                <div class="kontaktinfo">
                    <div class="nameinfo">
                        <label for="author">
                            "Namn "
                        <span class="required">*</span>
                        </label>
                        <input id="author" name="author" type="text" value size="32" maxlength="32" autocomplete="name" required>
                    </div>
                    <div class="messageinfo">
                        <label for="message">
                            "Meddelande "
                            <span class="required">*</span>
                        </label>
                        <textarea class="fixed-textarea" id="message" name="message" cols="45" rows="8" maxlength="500"></textarea>
                    </div>
                </div>
                

            </article>
        </div>
        <div class="bar"></div>
    </main>
    <footer>&copy; OllesAB</footer>
</body>
